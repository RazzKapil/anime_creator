
version: "3"
services:
  web:
    build: ./backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
  worker:
    build: ./worker
    command: celery -A worker.celery_worker worker --loglevel=info
    depends_on:
      - redis
  redis:
    image: redis
    ports:
      - "6379:6379"
